<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="crt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="crt-bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="crt-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square (Maskable Safe Zone) -->
  <rect width="512" height="512" rx="104" fill="url(#crt-bg)" />
  
  <!-- Outer Bezel -->
  <rect x="56" y="64" width="400" height="340" rx="36" fill="url(#crt-bezel)" stroke="#475569" stroke-width="6" />
  
  <!-- Inner Glass Screen with Curvature -->
  <rect x="88" y="96" width="336" height="260" rx="28" fill="url(#crt-screen)" stroke="#10b981" stroke-width="3" filter="url(#neon-glow)" />
  
  <!-- CRT Scanlines on Icon -->
  <g opacity="0.45" stroke="#10b981" stroke-width="2">
    <line x1="90" y1="120" x2="422" y2="120" />
    <line x1="90" y1="140" x2="422" y2="140" />
    <line x1="90" y1="160" x2="422" y2="160" />
    <line x1="90" y1="180" x2="422" y2="180" />
    <line x1="90" y1="200" x2="422" y2="200" />
    <line x1="90" y1="220" x2="422" y2="220" />
    <line x1="90" y1="240" x2="422" y2="240" />
    <line x1="90" y1="260" x2="422" y2="260" />
    <line x1="90" y1="280" x2="422" y2="280" />
    <line x1="90" y1="300" x2="422" y2="300" />
    <line x1="90" y1="320" x2="422" y2="320" />
    <line x1="90" y1="340" x2="422" y2="340" />
  </g>
  
  <!-- Retro CRT Emblem: Sine Wave / Phosphor Pulse -->
  <path d="M 120 226 C 170 150, 200 300, 256 226 C 310 150, 340 300, 392 226" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" filter="url(#neon-glow)" />
  
  <!-- Glitch Chromatic Aberration Echo -->
  <path d="M 122 224 C 172 148, 202 298, 258 224 C 312 148, 342 298, 394 224" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M 118 228 C 168 152, 198 302, 254 228 C 308 152, 338 302, 390 228" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  
  <!-- Screen Corner Glare / Reflection -->
  <path d="M 100 110 Q 256 120 380 140 A 24 24 0 0 0 350 110 Q 230 102 100 110 Z" fill="#ffffff" opacity="0.18" />
  
  <!-- Power LED & Knobs -->
  <circle cx="120" cy="380" r="6" fill="#10b981" filter="url(#neon-glow)" />
  <circle cx="340" cy="380" r="10" fill="#334155" stroke="#64748b" stroke-width="2" />
  <circle cx="380" cy="380" r="12" fill="#334155" stroke="#64748b" stroke-width="2" />
  <rect x="200" y="375" width="80" height="8" rx="4" fill="#0f172a" />
  
  <!-- Stand / Base -->
  <path d="M 200 404 L 180 448 L 332 448 L 312 404 Z" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <rect x="156" y="448" width="200" height="16" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3" />
</svg>
